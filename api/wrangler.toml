# Cloudflare Worker for the BoulderMe API. Deployed in T8; secrets are set with
# `npx wrangler secret put <NAME>` (names in ../.env.example), never in this file.
name = "boulderme-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# Public hostnames live on runsit.ca (docs/api/openapi.yaml `servers`), bound as Worker custom
# domains below. runsit.ca must be a zone in the same Cloudflare account; Cloudflare creates the
# DNS record and certificate on first deploy.

[vars]
ENVIRONMENT = "development"
APP_VERSION = "0.1.0"

# Daily housekeeping: expired nonces, rate-limit windows, idempotency keys, old sessions.
[triggers]
crons = ["17 4 * * *"]

[observability]
enabled = true

# Deployed by .github/workflows/deploy-staging.yml. APPLE_BUNDLE_ID is public, so it is a var here.
[env.staging]
name = "boulderme-api-staging"
workers_dev = false
routes = [{ pattern = "boulderme-api-staging.runsit.ca", custom_domain = true }]
vars = { ENVIRONMENT = "staging", APP_VERSION = "0.1.0", APPLE_BUNDLE_ID = "com.zainpi.boulderme.staging" }
triggers = { crons = ["17 4 * * *"] }

# Not deployed yet; production waits for the owner's go.
[env.production]
name = "boulderme-api"
workers_dev = false
routes = [{ pattern = "boulderme-api.runsit.ca", custom_domain = true }]
vars = { ENVIRONMENT = "production", APP_VERSION = "0.1.0", APPLE_BUNDLE_ID = "com.zainpi.boulderme" }
triggers = { crons = ["17 4 * * *"] }
