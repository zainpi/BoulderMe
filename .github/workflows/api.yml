name: api

on:
  pull_request:
    paths: ["api/**", "db/**", "docs/api/**", ".github/workflows/api.yml"]
  push:
    branches: [main]
    paths: ["api/**", "db/**", "docs/api/**", ".github/workflows/api.yml"]

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      # Local throwaway database only; never a real credential.
      TEST_DATABASE_URL: postgres://boulderme_api:boulderme_api_ci@localhost:5432/postgres
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Apply migrations to a scratch database
        working-directory: .
        run: |
          psql -v ON_ERROR_STOP=1 -q -f db/tests/local_supabase_roles.sql
          for f in db/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -v ON_ERROR_STOP=1 -q -c "alter role boulderme_api with login password 'boulderme_api_ci'"
      - run: npm ci
      - run: npm run typecheck
      - name: Tests (in-memory and Postgres, as role boulderme_api)
        run: npm test
      - run: npm run deploy:dry-run
