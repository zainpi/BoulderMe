name: deploy-staging

# Deploys the Worker to https://boulderme-api-staging.runsit.ca and runs the end-to-end check
# (api/e2e/staging-check.mjs) against it. Runs by hand, and on pushes to main that touch the API.
#
# GitHub secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   "Edit Cloudflare Workers" token with zone access to runsit.ca
#   CLOUDFLARE_ACCOUNT_ID  the account that holds the runsit.ca zone
#   STAGING_DATABASE_URL   pooler URL for role boulderme_api (SETUP.md §2)
# ACCESS_TOKEN_SIGNING_KEY, APPLE_TOKEN_ENCRYPTION_KEY and RATE_LIMIT_SALT are generated on the
# first deploy and kept. E2E_IDENTITY_KEY is generated for each run and removed afterwards.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/deploy-staging.yml"]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_URL: https://boulderme-api-staging.runsit.ca
      APPLE_BUNDLE_ID: com.zainpi.boulderme.staging
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check secrets are set
        working-directory: .
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$STAGING_DATABASE_URL" ] || missing="$missing STAGING_DATABASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing (see the top of deploy-staging.yml)"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Deploy
        run: npx wrangler deploy --env staging

      - name: Set Worker secrets
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          existing=$(npx wrangler secret list --env staging --format json 2>/dev/null | jq -r '.[].name')
          e2e_key=$(openssl rand -base64 32)
          echo "::add-mask::$e2e_key"
          echo "E2E_IDENTITY_KEY=$e2e_key" >> "$GITHUB_ENV"
          file="$RUNNER_TEMP/secrets.json"
          jq -n --arg db "$STAGING_DATABASE_URL" --arg e2e "$e2e_key" '{DATABASE_URL: $db, E2E_IDENTITY_KEY: $e2e}' > "$file"
          for name in ACCESS_TOKEN_SIGNING_KEY APPLE_TOKEN_ENCRYPTION_KEY RATE_LIMIT_SALT; do
            if ! grep -qx "$name" <<< "$existing"; then
              echo "Generating $name (first deploy)"
              value=$(openssl rand -base64 32)
              echo "::add-mask::$value"
              jq --arg k "$name" --arg v "$value" '.[$k] = $v' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
            fi
          done
          npx wrangler secret bulk "$file" --env staging
          rm -f "$file"

      - name: Wait for the custom domain
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS "$STAGING_URL/v1/health" 2>/dev/null) && echo "$body" | grep -q '"database":"ok"' && { echo "$body"; exit 0; }
            sleep 10
          done
          echo "::error::$STAGING_URL/v1/health did not report database ok"
          curl -sS "$STAGING_URL/v1/health" || true
          exit 1

      - name: End-to-end check
        env:
          API_BASE_URL: ${{ env.STAGING_URL }}
        run: node e2e/staging-check.mjs

      - name: Remove the test sign-in key
        if: always()
        run: |
          [ -n "${E2E_IDENTITY_KEY:-}" ] || exit 0
          echo '{"E2E_IDENTITY_KEY": null}' > "$RUNNER_TEMP/remove.json"
          npx wrangler secret bulk "$RUNNER_TEMP/remove.json" --env staging
